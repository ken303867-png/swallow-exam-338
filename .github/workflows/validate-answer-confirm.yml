name: Validate answer confirmation

on:
  push:
    branches: [feature/answer-confirm]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check answer confirmation script
        run: |
          node --check answer-confirm.js
          grep -q 'id="answerConfirm"' answer-confirm.js
          grep -q '解答確定' answer-confirm.js
          grep -q './answer-confirm.js' index.html
          grep -q './answer-confirm.js' sw.js
          grep -q 'swallow-exam-338-v2-confirm' sw.js
          ! grep -q 'localStorage.clear' answer-confirm.js
